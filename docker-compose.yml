services:
  # ── Coturn TURN / STUN server ────────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478"          # STUN / TURN
      - "3478:3478/udp"
      - "5349:5349"          # TURN TLS
      - "5349:5349/udp"
      - "49152-49252:49152-49252/udp"  # TURN relay ports
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped
    network_mode: host  # Coturn needs to see real client IPs for relay

  # ── Interstellar Voice Server (Go Edition) ───────────────────────
  voice-server:
    build:
      context: ./voice-server-go
      dockerfile: Dockerfile
    ports:
      - "22021:8000"         # Host:Container — WebSocket for voice chat
    environment:
      - OPTIMAL_PLAYERS=${OPTIMAL_PLAYERS:-0}
      - TURN_URL=${TURN_URL:-}
      - TURN_USER=${TURN_USER:-}
      - TURN_PASS=${TURN_PASS:-}
    restart: unless-stopped
    command: ["-addr", "0.0.0.0:8000"]
